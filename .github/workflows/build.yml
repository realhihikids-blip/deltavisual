name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DELTA-VISUALS-stage1/DELTA-VISUALS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          build-root-directory: DELTA-VISUALS-stage1/DELTA-VISUALS
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: delta-visuals
          path: DELTA-VISUALS-stage1/DELTA-VISUALS/build/libs/*.jar
